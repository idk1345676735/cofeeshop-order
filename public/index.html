<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Shop</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="header">
  <div>
    <h1>Coffee Shop</h1>
    <p>Замовляйте улюблену каву заздалегідь</p>
  </div>

  <button id="cartButton" class="primary-button">
    Кошик
    <span id="cartCount">0</span>
  </button>
</header>


<main class="container">

  <section class="hero">
    <div>
      <span class="eyebrow">Онлайн-замовлення</span>

      <h2>Менше очікування.<br>Більше кави.</h2>

      <p>
        Оберіть напої та десерти, оформіть замовлення
        і заберіть його у кав’ярні.
      </p>
    </div>
  </section>


  <section class="menu-section">

    <div class="section-heading">
      <div>
        <span class="eyebrow">Наше меню</span>
        <h2>Оберіть щось смачне</h2>
      </div>
    </div>

    <div id="categories" class="categories"></div>

    <div id="loading" class="state-message">
      Завантаження меню...
    </div>

    <div
      id="error"
      class="state-message error hidden"
    ></div>

    <div id="products" class="products"></div>

  </section>

</main>


<div id="overlay" class="overlay hidden"></div>

<aside id="cart" class="cart hidden">

  <div class="cart-header">
    <div>
      <span class="eyebrow">Ваш кошик</span>
      <h2>Замовлення</h2>
    </div>

    <button
      id="closeCart"
      class="icon-button"
      type="button"
    >
      ×
    </button>
  </div>

  <div id="cartItems" class="cart-items"></div>

  <div
    id="emptyCart"
    class="empty-state"
  >
    Кошик поки порожній.
  </div>


  <div class="cart-summary">

    <div class="total-row">
      <span>Разом</span>

      <strong>
        <span id="cartTotal">0</span> грн
      </strong>
    </div>


    <form id="orderForm">

      <label>
        Ваше ім’я

        <input
          id="customerName"
          type="text"
          placeholder="Наприклад, Андрій"
          required
        >
      </label>

      <label>
        Номер телефону

        <input
          id="customerPhone"
          type="tel"
          placeholder="+380..."
          required
        >
      </label>

      <button
        id="submitOrder"
        class="primary-button full"
        type="submit"
      >
        Оформити замовлення
      </button>

    </form>

    <div
      id="orderMessage"
      class="state-message"
    ></div>

  </div>

</aside>

<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>

</body>
</html>
