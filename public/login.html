<!DOCTYPE html>
<html lang="uk">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Вхід адміністратора | Coffee Shop</title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

</head>

<body class="admin-body">

  <main class="container">

    <div class="modal-card">

      <span class="eyebrow">
        Coffee Shop
      </span>

      <h1>
        Вхід адміністратора
      </h1>

      <form id="loginForm">

        <label>
          Логін

          <input
            id="login"
            type="text"
            required
          >
        </label>

        <label>
          Пароль

          <input
            id="password"
            type="password"
            required
          >
        </label>

        <button
          class="primary-button full"
          type="submit"
        >
          Увійти
        </button>

        <div
          id="loginMessage"
          class="state-message"
        ></div>

      </form>

    </div>

  </main>

  <script src="login.js"></script>

</body>

</html>
